name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows build and tests (.NET Framework 4.8.1 and .NET 9)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.x

      - name: Restore solution
        run: dotnet restore NekoLib.sln

      - name: Build all target frameworks
        run: dotnet build NekoLib.sln --configuration Release --no-restore

      - name: Test all target frameworks
        run: dotnet test NekoLib.sln --configuration Release --no-build --no-restore -m:1
