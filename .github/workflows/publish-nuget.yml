name: Publish NuGet release

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publish the approved NekoLib 1.1.0 package set to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: write # GitHub requires write access to read draft release assets.
  id-token: write

concurrency:
  group: publish-nuget-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish approved 1.1.0 artifacts
    runs-on: windows-latest
    environment: release
    timeout-minutes: 20

    steps:
      - name: Enforce the manual release boundary
        shell: pwsh
        env:
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
              throw "This workflow must be dispatched from master."
          }

          if ($env:CONFIRM_PUBLICATION -ne "true") {
              throw "Public NuGet publication was not confirmed."
          }

      - name: Download the approved package assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseId = 380040305
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId" `
              -Headers $headers
          $assets = @($release.assets | Where-Object {
              $_.name -match '^NekoLib\..+\.1\.1\.0\.(nupkg|snupkg)$'
          })

          if ($release.tag_name -ne "v1.1.0" -or -not $release.draft -or $assets.Count -ne 31) {
              throw "The approved v1.1.0 draft release or its 31 package assets could not be resolved."
          }

          New-Item -ItemType Directory -Force -Path artifacts/publish | Out-Null
          foreach ($asset in $assets) {
              $headers.Accept = "application/octet-stream"
              Invoke-WebRequest `
                  -Uri $asset.url `
                  -Headers $headers `
                  -OutFile (Join-Path artifacts/publish $asset.name)
          }

      - name: Verify the immutable package set
        shell: pwsh
        run: |
          $expectedAggregate = "C3E0764831636A74CD4969BDC609B16EAEF86FBE0A375C6741217F0F386E7F43"
          $files = @(Get-ChildItem -LiteralPath artifacts/publish -File | Sort-Object Name)
          $mainPackages = @($files | Where-Object { $_.Extension -eq ".nupkg" })
          $symbolPackages = @($files | Where-Object { $_.Extension -eq ".snupkg" })

          if ($files.Count -ne 31 -or $mainPackages.Count -ne 16 -or $symbolPackages.Count -ne 15) {
              throw "Expected 16 main packages and 15 symbol packages; found $($mainPackages.Count) and $($symbolPackages.Count)."
          }

          $manifestLines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              "$($file.Name)=$hash"
          }

          $manifest = ($manifestLines -join "`n") + "`n"
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($manifest)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
              $actualAggregate = ([System.BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace("-", "")
          }
          finally {
              $sha256.Dispose()
          }

          if ($actualAggregate -ne $expectedAggregate) {
              throw "Package-set aggregate SHA-256 mismatch. Expected $expectedAggregate; found $actualAggregate."
          }

          Write-Output "Verified 31 immutable package assets: $actualAggregate"

      - name: Obtain a short-lived NuGet.org credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Nekovih

      - name: Publish packages and symbols
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/publish -File -Filter *.nupkg | Sort-Object Name)
          foreach ($package in $packages) {
              & dotnet nuget push $package.FullName `
                  --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
                  --source "https://api.nuget.org/v3/index.json" `
                  --timeout 300

              if ($LASTEXITCODE -ne 0) {
                  throw "NuGet.org rejected $($package.Name) with exit code $LASTEXITCODE."
              }
          }
