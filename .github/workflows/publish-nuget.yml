name: Publish NuGet release

on:
  workflow_dispatch:
    inputs:
      confirm_publication:
        description: Publish the qualified immutable NekoLib package set to NuGet.org
        required: true
        default: false
        type: boolean
      version:
        description: Coordinated stable family version
        required: true
        type: string
      source_commit:
        description: Qualified package source commit (40 hex characters)
        required: true
        type: string
      package_set_sha256:
        description: SHA256 of the sorted filename=SHA256 manifest for all 31 assets
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-nuget-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish qualified release artifacts
    runs-on: windows-latest
    environment: release
    timeout-minutes: 20
    env:
      NEKOLIB_RELEASE_VERSION: ${{ inputs.version }}
      NEKOLIB_SOURCE_COMMIT: ${{ inputs.source_commit }}
      NEKOLIB_PACKAGE_SET_SHA256: ${{ inputs.package_set_sha256 }}

    steps:
      - name: Enforce the manual release boundary
        shell: pwsh
        env:
          CONFIRM_PUBLICATION: ${{ inputs.confirm_publication }}
        run: |
          if ($env:GITHUB_REF -ne "refs/heads/master") {
              throw "This workflow must be dispatched from master."
          }

          if ($env:CONFIRM_PUBLICATION -ne "true") {
              throw "Public NuGet publication was not confirmed."
          }
          if ($env:NEKOLIB_RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or
              $env:NEKOLIB_SOURCE_COMMIT -notmatch '^[a-fA-F0-9]{40}$' -or
              $env:NEKOLIB_PACKAGE_SET_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
              throw "Stable version, source commit or package-set hash is invalid."
          }

      - name: Download the approved package assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
              Accept = "application/vnd.github+json"
              Authorization = "Bearer $env:GH_TOKEN"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v$env:NEKOLIB_RELEASE_VERSION" `
              -Headers $headers
          $assets = @($release.assets | Where-Object {
              $_.name -match ('^NekoLib\..+\.' + [regex]::Escape($env:NEKOLIB_RELEASE_VERSION) + '\.(nupkg|snupkg)$')
          })

          if ($release.tag_name -ne "v$env:NEKOLIB_RELEASE_VERSION" -or -not $release.draft -or
              $release.target_commitish -ne $env:NEKOLIB_SOURCE_COMMIT -or $assets.Count -ne 31) {
              throw "The qualified draft release, source commit or its 31 package assets could not be resolved."
          }

          $tag = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$env:NEKOLIB_RELEASE_VERSION" -Headers $headers
          $tagObject = $tag.object
          if ($tagObject.type -eq 'tag') {
              $annotated = Invoke-RestMethod -Uri $tagObject.url -Headers $headers
              $tagObject = $annotated.object
          }
          if ($tagObject.type -ne 'commit' -or $tagObject.sha -ne $env:NEKOLIB_SOURCE_COMMIT) {
              throw "Release tag does not identify the qualified package source commit."
          }

          New-Item -ItemType Directory -Force -Path artifacts/publish | Out-Null
          foreach ($asset in $assets) {
              $headers.Accept = "application/octet-stream"
              Invoke-WebRequest `
                  -Uri $asset.url `
                  -Headers $headers `
                  -OutFile (Join-Path artifacts/publish $asset.name)
          }

      - name: Verify the immutable package set
        shell: pwsh
        run: |
          $expectedAggregate = $env:NEKOLIB_PACKAGE_SET_SHA256.ToUpperInvariant()
          $files = @(Get-ChildItem -LiteralPath artifacts/publish -File | Sort-Object Name)
          $mainPackages = @($files | Where-Object { $_.Extension -eq ".nupkg" })
          $symbolPackages = @($files | Where-Object { $_.Extension -eq ".snupkg" })

          if ($files.Count -ne 31 -or $mainPackages.Count -ne 16 -or $symbolPackages.Count -ne 15) {
              throw "Expected 16 main packages and 15 symbol packages; found $($mainPackages.Count) and $($symbolPackages.Count)."
          }

          $manifestLines = foreach ($file in $files) {
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
              "$($file.Name)=$hash"
          }

          $manifest = ($manifestLines -join "`n") + "`n"
          $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($manifest)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
              $actualAggregate = ([System.BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace("-", "")
          }
          finally {
              $sha256.Dispose()
          }

          if ($actualAggregate -ne $expectedAggregate) {
              throw "Package-set aggregate SHA-256 mismatch. Expected $expectedAggregate; found $actualAggregate."
          }

          $expectedIds = @('Core','Data','Inspection','Devices','Diagnostics','Diagnostics.Windows','Http','Logging','Mvvm','Navigation','Navigation.WinForms','Navigation.Wpf','Pipes','Telemetry','Watchdog','Watchdog.Host') | ForEach-Object { "NekoLib.$_" }
          foreach ($package in $mainPackages) {
              $archive = [IO.Compression.ZipFile]::OpenRead($package.FullName)
              try {
                  $nuspecs = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
                  if ($nuspecs.Count -ne 1) { throw "Invalid nuspec count: $($package.Name)" }
                  $reader = [IO.StreamReader]::new($nuspecs[0].Open())
                  try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
                  $metadata = $nuspec.package.metadata
                  if ($metadata.id -notin $expectedIds -or $metadata.version -ne $env:NEKOLIB_RELEASE_VERSION -or
                      $metadata.repository.commit -ne $env:NEKOLIB_SOURCE_COMMIT -or
                      $package.Name -ne "$($metadata.id).$env:NEKOLIB_RELEASE_VERSION.nupkg") {
                      throw "Package identity, family version or source provenance mismatch: $($package.Name)"
                  }
              }
              finally { $archive.Dispose() }
          }

          Write-Output "Verified 31 immutable package assets: $actualAggregate"

      - name: Obtain a short-lived NuGet.org credential
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Nekovih

      - name: Publish packages and symbols
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath artifacts/publish -File -Filter *.nupkg | Sort-Object Name)
          foreach ($package in $packages) {
              & dotnet nuget push $package.FullName `
                  --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
                  --source "https://api.nuget.org/v3/index.json" `
                  --timeout 300

              if ($LASTEXITCODE -ne 0) {
                  throw "NuGet.org rejected $($package.Name) with exit code $LASTEXITCODE."
              }
          }
